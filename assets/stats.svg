<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 232" width="490" height="232" role="img" aria-label="GitHub stats" font-family="'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace">
<title>GitHub stats</title>
<defs><pattern id="cf" width="8" height="8" patternUnits="userSpaceOnUse">
<rect width="8" height="8" fill="#0F1012"/><rect width="4" height="4" fill="#16181B"/><rect x="4" y="4" width="4" height="4" fill="#16181B"/>
<rect x="4" width="4" height="4" fill="#0B0C0E"/><rect y="4" width="4" height="4" fill="#0B0C0E"/></pattern><linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".9" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<rect width="490" height="232" rx="14" fill="#0A0B0D"/><rect x=".5" y=".5" width="489" height="231" rx="14" fill="none" stroke="#2A2C31"/>
<rect width="490" height="232" rx="14" fill="url(#cf)" opacity=".4"/>
<text x="25" y="38" font-size="18" font-weight="800" fill="#E10600">Telemetry</text>
<rect x="25" y="65" width="8" height="8" rx="2" fill="#E10600"/>
