<circle cx="388" cy="118" r="46" fill="none" stroke="#2A2C31" stroke-width="7"/>
<circle cx="388" cy="118" r="46" fill="none" stroke="#E10600" stroke-width="7" stroke-linecap="round" stroke-dasharray="2.38 289.03" transform="rotate(-90 388 118)"/>
<g><circle cx="388" cy="72" r="3.6" fill="#fff"/><animateTransform attributeName="transform" type="rotate" from="0 388 118" to="360 388 118" dur="6s" repeatCount="indefinite"/></g>
<text x="388" y="120" font-size="26" font-weight="800" fill="#E6E7EA" text-anchor="middle">3</text>
