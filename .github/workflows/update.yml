name: update-profile

on:
  schedule:
    - cron: "0 */3 * * *"        # every 3 hours
  push:
    branches: [main]
    paths: ["profile.toml", "scripts/**"]
  workflow_dispatch:              # "Run workflow" button in the Actions tab
  repository_dispatch:            # lets other repos ping a refresh (see SETUP.md)
    types: [refresh]

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild README and assets
        run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}   # optional, see SETUP.md
      - name: Commit if anything changed
        run: |
          git config user.name  "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "chore: refresh profile" && git push)
